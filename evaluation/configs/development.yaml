# CJ Evaluation — Development configuration
# 20 tasks, 3 repeats, real model required.
# Set CJ_EVAL_BASE_URL, CJ_EVAL_API_KEY, CJ_EVAL_MODEL before running.
# Run: python -m evaluation.run --config evaluation/configs/development.yaml

results_dir: results/development

experiments:
