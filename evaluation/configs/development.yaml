# CJ Evaluation — Development configuration
# 20 tasks, 3 repeats, real model required.
#
# Usage:
#   export OPENAI_API_KEY=sk-...
#   python -m evaluation.run --config evaluation/configs/development.yaml
#
# model: declares the LLM endpoint used across all experiments in this file.
# api_key_env names the shell variable that holds your key — the key itself
# is never written here.  Override any field with a CLI flag:
#   --model gpt-4o  --base-url https://api.openai.com

model:
  base_url:    https://api.openai.com
  api_key_env: OPENAI_API_KEY
  model:       gpt-4o-mini
  temperature: 0.0

results_dir: results/development

experiments:
  - system:     autogen
    benchmark:  humanevalplus
    fault:      none
    tasks:      20
    repeats:    3
    seed:       42

  - system:     autogen
    benchmark:  humanevalplus
    fault:      llm_timeout
    tasks:      20
    repeats:    3
    seed:       42

  - system:     autogen
    benchmark:  humanevalplus
    fault:      llm_rate_limit
    tasks:      20
    repeats:    3
    seed:       42

  - system:     autogen
    benchmark:  humanevalplus
    fault:      llm_unavailable
    tasks:      20
    repeats:    3
    seed:       42

  - system:     autogen
    benchmark:  humanevalplus
    fault:      response_truncation
    tasks:      20
    repeats:    3
    seed:       42

  - system:     autogen
    benchmark:  humanevalplus
    fault:      malformed_response
    tasks:      20
    repeats:    3
    seed:       42

  - system:     mad
    benchmark:  humanevalplus
    fault:      none
    tasks:      20
    repeats:    3
    seed:       42

  - system:     mad
    benchmark:  humanevalplus
    fault:      llm_timeout
    tasks:      20
    repeats:    3
    seed:       42

  - system:     mapcoder
    benchmark:  humanevalplus
    fault:      none
    tasks:      20
    repeats:    3
    seed:       42

  - system:     mapcoder
    benchmark:  humanevalplus
    fault:      llm_timeout
    tasks:      20
    repeats:    3
    seed:       42

  - system:     autogen
    benchmark:  mbppplus
