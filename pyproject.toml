[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaos-jungle"
version = "0.1.0"
description = "A generic chaos engineering framework for distributed systems"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "chaos-jungle contributors" }
]
keywords = ["chaos", "engineering", "fault injection", "testing", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]
dependencies = [
    "paramiko>=3.0,<6.0",
    "click>=8.0,<9.0",
    "requests>=2.28,<3.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "myst-parser>=2.0",
    "sphinxcontrib-mermaid>=0.9",
    "sphinx-design>=0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.4",
]
evaluation = [
    # Real agent frameworks — required for autogen-real, langgraph-real, crewai-real
    # All require Python >=3.10; guarded by marker so the core package stays 3.9-compatible.
    "autogen-agentchat>=0.4.0,<0.8.0; python_version>='3.10'",
    "autogen-ext[openai]>=0.4.0,<0.8.0; python_version>='3.10'",
    "langgraph>=0.2.0,<2.0.0; python_version>='3.10'",
    "langchain-openai>=0.1.0,<2.0.0; python_version>='3.10'",
    "crewai>=0.100.0,<2.0.0; python_version>='3.10'",
    # Benchmark evaluation
    "evalplus==0.3.1",
    # Credential management
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
chaos-jungle = "chaos_jungle.control.cli:main"
cj-daemon    = "chaos_jungle.control.daemon:run"

[project.entry-points."pytest11"]
chaos-jungle = "chaos_jungle.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["chaos_jungle"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation/tests"]
addopts = "-v --tb=short -m 'not real_eval'"
markers = [
    "real_eval: requires evaluation package dependencies (autogen-agentchat, langgraph, crewai)",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
