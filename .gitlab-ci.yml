stages:
  - test
  - build
  - verify
  - publish

unit_tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12"]
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
    - python -m pytest tests/ -q --strict-markers

lint:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install "ruff==0.17.4"
    - python ci/check_ruff_baseline.py

docs_build:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install ".[docs]"
    - python -m sphinx -q -b html docs docs/_build/html
  artifacts:
    paths:
      - docs/_build/html/
    expire_in: 1 week

build_dist:
  stage: build
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade build twine
    - python -m build
    - python -m twine check dist/*
    - |
      python - <<'PY'
      from pathlib import Path
      from tarfile import open as open_tar
      from zipfile import ZipFile

      wheel, = Path("dist").glob("*.whl")
      sdist, = Path("dist").glob("*.tar.gz")
      resource = "chaos_jungle/scripts/bpf/flow_modify.c"
      with ZipFile(wheel) as archive:
          assert resource in archive.namelist(), f"Missing wheel resource: {resource}"
      with open_tar(sdist) as archive:
          names = archive.getnames()
          assert any(name.endswith("/" + resource) for name in names)
          assert not any("/evaluation/" in name or "/results/" in name for name in names)
      PY
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

verify_dist:
  stage: verify
  image: python:3.12-slim
  needs:
    - job: build_dist
      artifacts: true
  script:
    - python -m pip install dist/*.whl
    - cd /tmp
    - python -c 'from importlib.metadata import version; from importlib.resources import files; import chaos_jungle; assert version("chaos-jungle") == chaos_jungle.__version__; assert (files("chaos_jungle.scripts.bpf") / "flow_modify.c").is_file()'
    - chaos-jungle --help

publish_pypi:
  stage: publish
  image: python:3.12-slim
  needs:
    - job: build_dist
      artifacts: true
    - job: verify_dist
      artifacts: false
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment:
    name: pypi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
    - when: never
  script:
    - |
      python - <<'PY'
      import os
      import tomllib
      from pathlib import Path

      version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
      assert os.environ["CI_COMMIT_TAG"] == f"v{version}", "Tag must match project version"
      assert "Local only" not in Path("README.md").read_text(), "Review README before release"
      PY
    - python -m pip install --upgrade twine
    - python -m twine upload dist/*
